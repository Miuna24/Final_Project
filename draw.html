<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Draw for the Forest</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #72766f;
      --paper: #f5f4f0;
      --card: #fffefa;
      --line: #e4e2db;
      --green: #245c43;
      --green-dark: #194733;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px clamp(18px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 250, .85);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 750; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: #e2eee3; font-size: 19px; }
    .top-actions { display: flex; align-items: center; gap: 18px; }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #d78c43; }
    .dot.online { background: #43a66c; }
    .link-button, .primary-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 650;
      text-decoration: none;
    }
    .link-button { background: #eeede7; color: var(--ink); }
    .primary-button { background: var(--green); color: white; }
    .primary-button:hover { background: var(--green-dark); }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 80px; }
    .eyebrow { margin: 0 0 9px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 40px); letter-spacing: -.045em; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
    .draw-heading { margin-bottom: 22px; }
    .draw-card { padding: clamp(14px, 4vw, 24px); border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 10px 35px rgba(30, 34, 28, .04); }
    .name-input { width: 100%; height: 43px; margin-bottom: 14px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: white; }
    .canvas-wrap { overflow: hidden; border: 1px solid #deddd7; border-radius: 11px; background: white; touch-action: none; }
    #drawing-canvas { display: block; width: 100%; aspect-ratio: 4 / 3; touch-action: none; cursor: crosshair; }
    .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 13px; padding: 16px 0 10px; }
    .tool-group { display: grid; align-content: start; gap: 6px; color: var(--muted); font-size: 13px; }
    .tool-input { width: 100%; min-height: 38px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); }
    #brush-color, #gradient-color { width: 100%; height: 38px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    #brush-size { width: 100%; min-height: 38px; accent-color: var(--green); }
    .draw-actions { display: flex; gap: 10px; }
    .draw-actions button { min-height: 46px; }
    #clear-button { padding: 0 16px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); }
    #add-button { flex: 1; }
    .tool-hint { min-height: 20px; margin: 3px 0 12px; color: var(--muted); font-size: 13px; }
    .notice { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .topbar { padding: 13px 16px; }
      .connection { font-size: 12px; }
      .top-actions { gap: 10px; }
      .link-button { min-height: 38px; padding: 0 11px; font-size: 13px; }
      main { padding-top: 30px; }
      .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> Little Big Gallery</div>
    <div class="top-actions">
      <div class="connection" aria-live="polite"><span id="connection-dot" class="dot"></span><span id="connection-label">Connecting…</span></div>
      <a class="link-button" href="/">Forest gallery</a>
    </div>
  </header>

  <main>
    <section class="draw-heading">
      <p class="eyebrow">Your turn</p>
      <h1>Make a little something.</h1>
      <p class="subtitle">Use brushes, shapes, fills, and gradients, then add your art to the forest.</p>
    </section>
    <section class="draw-card" aria-label="Drawing area">
      <input id="artist-name" class="name-input" maxlength="24" placeholder="Your name (optional)" aria-label="Your name, optional">
      <div class="canvas-wrap"><canvas id="drawing-canvas" width="800" height="600" aria-label="Drawing canvas"></canvas></div>
      <div class="tools">
        <label class="tool-group" for="tool-mode">Tool
          <select id="tool-mode" class="tool-input">
            <option value="brush">Brush</option>
            <option value="line">Line</option>
            <option value="rectangle">Rectangle</option>
            <option value="ellipse">Ellipse</option>
            <option value="triangle">Triangle</option>
            <option value="fill">Fill bucket</option>
            <option value="gradient">Gradient</option>
          </select>
        </label>
        <label class="tool-group" for="brush-type">Brush type
          <select id="brush-type" class="tool-input">
            <option value="pen">Pen</option>
            <option value="marker">Marker</option>
            <option value="spray">Spray</option>
            <option value="glow">Glow</option>
            <option value="eraser">Eraser</option>
          </select>
        </label>
        <label class="tool-group" for="shape-style">Shape style
          <select id="shape-style" class="tool-input">
            <option value="outline">Outline</option>
            <option value="filled">Solid fill</option>
            <option value="gradient">Gradient fill</option>
          </select>
        </label>
        <label class="tool-group" for="brush-color">Color
          <input id="brush-color" type="color" value="#f4e6bd">
        </label>
        <label id="gradient-color-control" class="tool-group" for="gradient-color" hidden>Second color
          <input id="gradient-color" type="color" value="#70c8a0">
        </label>
        <label class="tool-group" for="brush-size">Brush size
          <input id="brush-size" type="range" min="2" max="32" value="7">
        </label>
      </div>
      <p id="tool-hint" class="tool-hint" aria-live="polite"></p>
      <div class="draw-actions">
        <button id="clear-button" type="button">Clear</button>
        <button id="add-button" class="primary-button" type="button">Add to forest</button>
      </div>
      <p id="draw-notice" class="notice" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      const connectionDot = document.getElementById("connection-dot");
      const connectionLabel = document.getElementById("connection-label");
      const canvas = document.getElementById("drawing-canvas");
      const context = canvas.getContext("2d");
      const toolMode = document.getElementById("tool-mode");
      const brushType = document.getElementById("brush-type");
      const shapeStyle = document.getElementById("shape-style");
      const color = document.getElementById("brush-color");
      const gradientColor = document.getElementById("gradient-color");
      const gradientColorControl = document.getElementById("gradient-color-control");
      const size = document.getElementById("brush-size");
      const toolHint = document.getElementById("tool-hint");
      const notice = document.getElementById("draw-notice");
      let socket;
      let drawing = false;
      let startPoint = null;
      let previousPoint = null;
      let canvasSnapshot = null;

      context.lineCap = "round";
      context.lineJoin = "round";

      function setConnection(isConnected) {
        connectionDot.classList.toggle("online", isConnected);
        connectionLabel.textContent = isConnected ? "Connected" : "Reconnecting…";
      }

      function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(protocol + "//" + window.location.host + "/ws");
        socket.addEventListener("open", function () { setConnection(true); });
        socket.addEventListener("close", function () {
          setConnection(false);
          window.setTimeout(connect, 1500);
        });
        socket.addEventListener("error", function () { socket.close(); });
        socket.addEventListener("message", function (event) {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch (error) {
            console.error("Could not read gallery update:", error);
            return;
          }
          if (message.type === "added") {
            clearCanvas();
            notice.textContent = "Added to the forest — make another whenever you like!";
          }
          if (message.type === "error") notice.textContent = message.message;
        });
      }

      function isShapeTool(tool) {
        return tool === "rectangle" || tool === "ellipse" || tool === "triangle";
      }

      function updateToolControls() {
        const tool = toolMode.value;
        const isShape = isShapeTool(tool);
        brushType.disabled = tool !== "brush";
        shapeStyle.disabled = !isShape;
        gradientColorControl.hidden = tool !== "gradient" && !(isShape && shapeStyle.value === "gradient");
        canvas.style.cursor = tool === "fill" ? "cell" : "crosshair";

        const brushHints = {
          pen: "Draw smooth solid lines.",
          marker: "Draw broad translucent strokes.",
          spray: "Scatter small dots across the canvas.",
          glow: "Draw strokes with a soft glow.",
          eraser: "Erase parts of your drawing."
        };
        const hints = {
          line: "Drag to draw a straight line.",
          rectangle: "Drag to draw a rectangle.",
          ellipse: "Drag to draw an ellipse.",
          triangle: "Drag to draw a triangle.",
          fill: "Tap inside an enclosed area to fill it.",
          gradient: "Drag to paint a gradient stroke between the two colors."
        };
        toolHint.textContent = isShape && shapeStyle.value === "gradient"
          ? "Drag to draw a shape filled with a gradient."
          : tool === "brush" ? brushHints[brushType.value] : hints[tool];
      }

      function point(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - bounds.left) * canvas.width / bounds.width,
          y: (event.clientY - bounds.top) * canvas.height / bounds.height
        };
      }

      function drawBrushSegment(from, to) {
        const brush = brushType.value;
        const lineWidth = Number(size.value);
        if (brush === "spray") {
          spraySegment(from, to, lineWidth * 2);
          return;
        }

        context.save();
        context.beginPath();
        context.moveTo(from.x, from.y);
        context.lineTo(to.x, to.y);
        context.lineWidth = brush === "marker" || brush === "eraser" ? lineWidth * 2 : lineWidth;
        if (brush === "eraser") {
          context.globalCompositeOperation = "destination-out";
        } else {
          context.strokeStyle = color.value;
          if (brush === "marker") context.globalAlpha = .38;
          if (brush === "glow") {
            context.shadowColor = color.value;
            context.shadowBlur = lineWidth * 1.8;
          }
        }
        context.stroke();
        context.restore();
      }

      function spraySegment(from, to, radius) {
        const distance = Math.hypot(to.x - from.x, to.y - from.y);
        const steps = Math.max(1, Math.ceil(distance / Math.max(3, radius * .45)));
        context.save();
        context.fillStyle = color.value;
        for (let step = 0; step <= steps; step++) {
          const progress = step / steps;
          const centerX = from.x + (to.x - from.x) * progress;
          const centerY = from.y + (to.y - from.y) * progress;
          for (let particle = 0; particle < 22; particle++) {
            const angle = Math.random() * Math.PI * 2;
            const distanceFromCenter = Math.sqrt(Math.random()) * radius;
            context.globalAlpha = .25 + Math.random() * .5;
            context.beginPath();
            context.arc(
              centerX + Math.cos(angle) * distanceFromCenter,
              centerY + Math.sin(angle) * distanceFromCenter,
              .5 + Math.random() * 1.3,
              0,
              Math.PI * 2
            );
            context.fill();
          }
        }
        context.restore();
      }

      function drawShape(tool, from, to) {
        const left = Math.min(from.x, to.x);
        const right = Math.max(from.x, to.x);
        const top = Math.min(from.y, to.y);
        const bottom = Math.max(from.y, to.y);
        context.save();
        context.beginPath();
        if (tool === "line") {
          context.moveTo(from.x, from.y);
          context.lineTo(to.x, to.y);
          context.strokeStyle = color.value;
          context.lineWidth = Number(size.value);
          context.stroke();
          context.restore();
          return;
        }
        if (tool === "rectangle") {
          context.rect(left, top, right - left, bottom - top);
        } else if (tool === "ellipse") {
          context.ellipse(
            (left + right) / 2,
            (top + bottom) / 2,
            Math.max(1, (right - left) / 2),
            Math.max(1, (bottom - top) / 2),
            0,
            0,
            Math.PI * 2
          );
        } else {
          context.moveTo((left + right) / 2, top);
          context.lineTo(right, bottom);
          context.lineTo(left, bottom);
          context.closePath();
        }

        context.lineWidth = Number(size.value);
        if (shapeStyle.value === "outline") {
          context.strokeStyle = color.value;
          context.stroke();
        } else {
          if (shapeStyle.value === "gradient") {
            const gradient = context.createLinearGradient(
              left,
              top,
              right === left ? left + 1 : right,
              bottom === top ? top + 1 : bottom
            );
            gradient.addColorStop(0, color.value);
            gradient.addColorStop(1, gradientColor.value);
            context.fillStyle = gradient;
          } else {
            context.fillStyle = color.value;
          }
          context.fill();
        }
        context.restore();
      }

      function drawGradientStroke(from, to) {
        context.save();
        context.beginPath();
        context.moveTo(from.x, from.y);
        context.lineTo(to.x, to.y);
        context.lineWidth = Number(size.value);
        const gradient = context.createLinearGradient(from.x, from.y, to.x, to.y);
        gradient.addColorStop(0, color.value);
        gradient.addColorStop(1, gradientColor.value);
        context.strokeStyle = gradient;
        context.stroke();
        context.restore();
      }

      function previewTool(position) {
        context.putImageData(canvasSnapshot, 0, 0);
        if (toolMode.value === "gradient") {
          drawGradientStroke(startPoint, position);
        } else {
          drawShape(toolMode.value, startPoint, position);
        }
      }

      function colorMatches(data, offset, target) {
        if (target[3] < 16) return data[offset + 3] < 16;
        return Math.abs(data[offset] - target[0]) <= 32 &&
          Math.abs(data[offset + 1] - target[1]) <= 32 &&
          Math.abs(data[offset + 2] - target[2]) <= 32 &&
          Math.abs(data[offset + 3] - target[3]) <= 48;
      }

      function fillArea(position) {
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = image.data;
        const x = Math.max(0, Math.min(canvas.width - 1, Math.floor(position.x)));
        const y = Math.max(0, Math.min(canvas.height - 1, Math.floor(position.y)));
        const start = y * canvas.width + x;
        const offset = start * 4;
        const target = [pixels[offset], pixels[offset + 1], pixels[offset + 2], pixels[offset + 3]];
        const replacement = [
          parseInt(color.value.slice(1, 3), 16),
          parseInt(color.value.slice(3, 5), 16),
          parseInt(color.value.slice(5, 7), 16),
          255
        ];
        if (target[0] === replacement[0] &&
            target[1] === replacement[1] &&
            target[2] === replacement[2] &&
            target[3] === replacement[3]) return;

        const visited = new Uint8Array(canvas.width * canvas.height);
        const queue = new Uint32Array(canvas.width * canvas.height);
        let head = 0;
        let tail = 0;
        function enqueue(neighbor) {
          if (neighbor < 0 || neighbor >= visited.length || visited[neighbor]) return;
          visited[neighbor] = 1;
          queue[tail++] = neighbor;
        }
        queue[tail++] = start;
        visited[start] = 1;
        while (head < tail) {
          const index = queue[head++];
          const pixelOffset = index * 4;
          if (!colorMatches(pixels, pixelOffset, target)) continue;
          pixels[pixelOffset] = replacement[0];
          pixels[pixelOffset + 1] = replacement[1];
          pixels[pixelOffset + 2] = replacement[2];
          pixels[pixelOffset + 3] = replacement[3];

          const pixelX = index % canvas.width;
          if (pixelX > 0) enqueue(index - 1);
          if (pixelX < canvas.width - 1) enqueue(index + 1);
          if (index >= canvas.width) enqueue(index - canvas.width);
          if (index + canvas.width < visited.length) enqueue(index + canvas.width);
        }
        context.putImageData(image, 0, 0);
        notice.textContent = "Filled area.";
      }

      canvas.addEventListener("pointerdown", function (event) {
        const position = point(event);
        if (toolMode.value === "fill") {
          fillArea(position);
          return;
        }

        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        startPoint = position;
        previousPoint = position;
        notice.textContent = "";
        if (toolMode.value === "gradient" || isShapeTool(toolMode.value) || toolMode.value === "line") {
          canvasSnapshot = context.getImageData(0, 0, canvas.width, canvas.height);
          previewTool(position);
        } else {
          drawBrushSegment(position, { x: position.x + .1, y: position.y + .1 });
        }
      });

      canvas.addEventListener("pointermove", function (event) {
        if (!drawing) return;
        const position = point(event);
        if (toolMode.value === "gradient" || isShapeTool(toolMode.value) || toolMode.value === "line") {
          previewTool(position);
        } else {
          drawBrushSegment(previousPoint, position);
          previousPoint = position;
        }
      });

      function stopDrawing(event) {
        if (!drawing) return;
        const position = point(event);
        if (toolMode.value === "gradient" || isShapeTool(toolMode.value) || toolMode.value === "line") {
          previewTool(position);
        }
        drawing = false;
        canvasSnapshot = null;
      }
      canvas.addEventListener("pointerup", stopDrawing);
      function cancelDrawing() {
        if (!drawing) return;
        if (canvasSnapshot) context.putImageData(canvasSnapshot, 0, 0);
        drawing = false;
        canvasSnapshot = null;
      }
      canvas.addEventListener("pointercancel", cancelDrawing);
      canvas.addEventListener("lostpointercapture", cancelDrawing);

      function clearCanvas() {
        context.clearRect(0, 0, canvas.width, canvas.height);
      }

      toolMode.addEventListener("change", updateToolControls);
      brushType.addEventListener("change", updateToolControls);
      shapeStyle.addEventListener("change", updateToolControls);
      updateToolControls();

      document.getElementById("clear-button").addEventListener("click", function () {
        clearCanvas();
        notice.textContent = "";
      });
      document.getElementById("add-button").addEventListener("click", function () {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          notice.textContent = "Not connected yet. Please try again in a moment.";
          return;
        }
        socket.send(JSON.stringify({
          type: "add",
          name: document.getElementById("artist-name").value.trim(),
          image: canvas.toDataURL("image/png")
        }));
        notice.textContent = "Adding your drawing…";
      });

      connect();
    }());
  </script>
</body>
</html>
